name: calc_core
description: >
  Shared code for CalcSathi's mobile app and admin panel: data models,
  the calculator formula engine, and design tokens. Pure Dart — no
  Flutter dependency, so it can be unit-tested without a device/emulator.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  # Kept intentionally minimal — this package should stay dependency-light
  # since both apps pull it in directly.

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
