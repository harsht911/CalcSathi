name: calcsathi_mobile
description: >
  CalcSathi — a universal calculator platform. Dozens of calculators, a
  coin-based free tier, Premium subscriptions, and a custom formula builder.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  calc_core:
    path: ../../packages/calc_core

  # Firebase — free on Spark (Auth, Firestore, Messaging, Analytics,
  # Crashlytics, App Check). No Cloud Functions client SDK needed: the
  # `server/` service is called over plain HTTPS instead.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_app_check: ^0.3.1+3

  # Auth providers wired to the "no phone/OTP" decision (Spark plan doesn't
  # support real SMS delivery).
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # Receives the deep link when a user taps a passwordless email-link
  # sign-in link (App Links on Android, Universal Links on iOS).
  app_links: ^7.0.0

  # Caches the email address an email-link sign-in was requested for, so
  # completing the sign-in on the same device doesn't have to ask again.
  shared_preferences: ^2.5.5

  # State management — kept simple and explicit rather than pulling in a
  # heavier framework this early.
  provider: ^6.1.2

  # In-app purchases / subscriptions, via RevenueCat (webhooks land on
  # server/, not on a Cloud Function).
  purchases_flutter: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Fake FirebaseAuth/Firestore for widget tests — CI has no real Firebase
  # project to talk to, and these let the auth screens render and be
  # interacted with in tests without one. Pinned to versions from the
  # firebase_auth 5.x / cloud_firestore 5.x era to match the pins above.
  firebase_auth_mocks: ^0.14.1
  fake_cloud_firestore: ^3.0.3

flutter:
  uses-material-design: true
