name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]

jobs:
  calc_core:
    name: calc_core (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: packages/calc_core
      - run: dart analyze
        working-directory: packages/calc_core
      - run: dart test
        working-directory: packages/calc_core

  mobile:
    name: apps/mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Generate CI-only firebase_options.dart stub
        # lib/firebase_options.dart is gitignored (it's generated locally by
        # `flutterfire configure` and holds project-specific values) but
        # main.dart/firebase_bootstrap.dart import it, so `flutter analyze`
        # and `flutter test` need *some* file there with the right shape.
        # This stub is CI-only and never touches a real Firebase project —
        # the widget tests inject fake FirebaseAuth/Firestore instances and
        # never exercise DefaultFirebaseOptions at runtime.
        run: |
          mkdir -p lib
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show TargetPlatform, defaultTargetPlatform, kIsWeb;

          /// CI-only stub — see the "Generate CI-only firebase_options.dart
          /// stub" step in .github/workflows/ci.yml. Local development uses
          /// the real, gitignored file generated by `flutterfire configure`.
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) return web;
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions are not supported for this platform.',
                  );
              }
            }

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: 'ci-stub',
              appId: 'ci-stub',
              messagingSenderId: 'ci-stub',
              projectId: 'ci-stub',
            );

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'ci-stub',
              appId: 'ci-stub',
              messagingSenderId: 'ci-stub',
              projectId: 'ci-stub',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: 'ci-stub',
              appId: 'ci-stub',
              messagingSenderId: 'ci-stub',
              projectId: 'ci-stub',
            );
          }
          EOF
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  admin:
    name: apps/admin (Flutter Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/admin
      - run: flutter analyze
        working-directory: apps/admin
      - run: flutter test
        working-directory: apps/admin
      - run: flutter build web
        working-directory: apps/admin

  server:
    name: server (Node/Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm test
        working-directory: server
